<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🏆 체험단 보드</title>
<meta name="description" content="무신사·카카오 선물하기 체험단 신청 내역, 발표일, 후기 마감을 한눈에 보는 개인 보드" />
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="체험단 보드" />
<script>
  // 첫 페인트 전에 저장된 테마 적용 (깜빡임 방지)
  try {
    var _t = JSON.parse(localStorage.getItem("trialboard.v1") || "{}").theme || "";
    document.documentElement.setAttribute("data-theme", _t);
  } catch (e) { document.documentElement.setAttribute("data-theme", ""); }
</script>
<style>
  :root {
    --bg: #f4f6fa;
    --bg-soft: #ffffff;
    --card: #ffffff;
    --card-2: #f8fafc;
    --text: #101827;
    --text-2: #475569;
    --muted: #7b8798;
    --line: #e6eaf1;
    --line-soft: #eef1f6;
    --accent: #5b6cff;
    --accent-2: #8b5cf6;
    --gold: #d99b1c;
    --green: #0f9d6e;
    --red: #e2544a;
    --blue: #2f7fe0;
    --shadow: 0 1px 2px rgba(16, 24, 39, .04), 0 8px 24px rgba(16, 24, 39, .06);
    --shadow-strong: 0 10px 30px rgba(16, 24, 39, .12);
    --radius: 18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html[data-theme="dark"] {
    --bg: #080b12;
    --bg-soft: #0e131c;
    --card: #131a25;
    --card-2: #0f1620;
    --text: #e9eef7;
    --text-2: #b3bfd0;
    --muted: #8593a6;
    --line: #232c3a;
    --line-soft: #1b2430;
    --accent: #7c8cff;
    --accent-2: #a78bfa;
    --gold: #f0b429;
    --green: #35c28c;
    --red: #ff6f66;
    --blue: #5aa2f0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .32);
    --shadow-strong: 0 12px 36px rgba(0, 0, 0, .5);
  }
  @media (prefers-color-scheme: dark) {
    html[data-theme=""] {
      --bg: #080b12;
      --bg-soft: #0e131c;
      --card: #131a25;
      --card-2: #0f1620;
      --text: #e9eef7;
      --text-2: #b3bfd0;
      --muted: #8593a6;
      --line: #232c3a;
      --line-soft: #1b2430;
      --accent: #7c8cff;
      --accent-2: #a78bfa;
      --gold: #f0b429;
      --green: #35c28c;
      --red: #ff6f66;
      --blue: #5aa2f0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .32);
      --shadow-strong: 0 12px 36px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
      "맑은 고딕", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    padding-bottom: calc(32px + var(--safe-b));
    overflow-x: hidden;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* ── top bar ─────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
    border-bottom: 1px solid var(--line-soft);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .topbar-in { display: flex; align-items: center; gap: 12px; padding: 12px 0 11px; }
  .logo {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px;
    display: grid; place-items: center; font-size: 20px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.03em; }
  .brand p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .topbar .spacer { flex: 1; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    font-size: 16px; cursor: pointer; transition: transform .15s ease, background .2s;
  }
  .icon-btn:active { transform: scale(.94); }

  /* ── summary ─────────────────────────────── */
  .hero { padding: 16px 0 4px; }
  .summary {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
  }
  .stat-card {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 14px 12px;
    box-shadow: var(--shadow);
  }
  .stat-card .label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .stat-card .value {
    margin-top: 5px; font-size: 24px; font-weight: 800; letter-spacing: -0.04em;
    line-height: 1.15; display: flex; align-items: baseline; gap: 4px;
  }
  .stat-card .value small { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0; }
  .stat-card .hint { margin-top: 4px; font-size: 11.5px; color: var(--text-2); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-card.accent {
    grid-column: span 2;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--card)), var(--card) 62%);
    border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
  }
  .stat-card.accent .value { font-size: 20px; }
  .stat-card.win .value { color: var(--gold); }
  .stat-card.review .value { color: var(--green); }
  .stat-card.fast .value { color: var(--accent); }
  .pill-mini {
    display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 7px;
    border-radius: 999px; background: var(--card-2); color: var(--text-2);
    border: 1px solid var(--line); vertical-align: 3px;
  }

  /* ── controls ────────────────────────────── */
  .controls { margin-top: 18px; position: sticky; top: 61px; z-index: 20; padding-bottom: 8px;
    background: linear-gradient(var(--bg) 84%, transparent); }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 0 12px; height: 44px; box-shadow: var(--shadow);
  }
  .search svg { flex: 0 0 auto; color: var(--muted); }
  .search input {
    flex: 1; border: 0; outline: 0; background: transparent; color: var(--text);
    font-size: 15px; font-family: inherit; height: 100%; min-width: 0;
  }
  .search input::placeholder { color: var(--muted); }
  .sort-btn {
    height: 44px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-family: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap;
    max-width: 122px;
  }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 10px 0 2px;
    scrollbar-width: none; -ms-overflow-style: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--text-2);
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px;
    border-radius: 999px; cursor: pointer; transition: all .16s ease; white-space: nowrap;
  }
  .chip .n { font-size: 11px; color: var(--muted); margin-left: 3px; font-weight: 700; }
  .chip[aria-pressed="true"] {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .chip[aria-pressed="true"] .n { color: rgba(255, 255, 255, .78); }
  .row-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em;
    text-transform: uppercase; padding-top: 8px; }

  /* ── list ────────────────────────────────── */
  .list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 14px 12px; box-shadow: var(--shadow);
    animation: rise .26s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card.done { opacity: .62; }
  .card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 7px;
    border: 1px solid transparent; letter-spacing: -0.01em;
  }
  .badge.musinsa { background: color-mix(in srgb, #111 8%, var(--card-2)); color: var(--text);
    border-color: var(--line); }
  html[data-theme="dark"] .badge.musinsa { background: #1c2431; }
  .badge.kakao { background: color-mix(in srgb, #f7e600 26%, var(--card)); color: #8a6d00; border-color: #f0d94a66; }
  html[data-theme="dark"] .badge.kakao { color: #ffdf3d; background: #2a2708; border-color: #6b5f0b; }
  .badge.\32 9cm { background: color-mix(in srgb, #ff2d55 14%, var(--card)); color: #d91a44; border-color: #ff2d5540; }
  .badge.applied { background: color-mix(in srgb, var(--blue) 12%, var(--card)); color: var(--blue); }
  .badge.won { background: color-mix(in srgb, var(--gold) 16%, var(--card)); color: var(--gold); }
  .badge.reviewed { background: color-mix(in srgb, var(--green) 14%, var(--card)); color: var(--green); }
  .badge.lost { background: var(--card-2); color: var(--muted); }
  .dday {
    margin-left: auto; font-size: 12px; font-weight: 800; letter-spacing: -0.02em;
    padding: 3px 9px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 13%, var(--card));
    color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--line));
    white-space: nowrap;
  }
  .dday.hot { background: color-mix(in srgb, var(--red) 13%, var(--card)); color: var(--red);
    border-color: color-mix(in srgb, var(--red) 30%, var(--line)); }
  .dday.past { background: var(--card-2); color: var(--muted); border-color: var(--line); }
  .title { margin: 9px 0 0; font-size: 15.5px; font-weight: 700; line-height: 1.38; letter-spacing: -0.025em; }
  .option { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .option b { color: var(--text-2); font-weight: 700; }
  .metrics { display: flex; gap: 9px; margin-top: 11px; }
  .metric {
    flex: 1; background: var(--card-2); border: 1px solid var(--line-soft);
    border-radius: 12px; padding: 8px 10px;
  }
  .metric .k { font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .metric .v { font-size: 14.5px; font-weight: 800; letter-spacing: -0.02em; margin-top: 1px; }
  .metric .v em { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 600; }
  .metric.hl .v { color: var(--accent); }
  .timeline { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .tl {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: 12.5px;
    color: var(--text-2); min-width: 0;
  }
  .tl .sub { min-width: 0; overflow-wrap: anywhere; }
  .tl .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: 0 0 6px; }
  .tl .dot.a { background: var(--accent); }
  .tl .dot.r { background: var(--green); }
  .tl b { font-weight: 700; color: var(--text); }
  .tl .sub { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 7px;
    background: color-mix(in srgb, var(--gold) 14%, var(--card)); color: var(--gold);
    border: 1px solid color-mix(in srgb, var(--gold) 26%, var(--line)); }
  .tag.gray { background: var(--card-2); color: var(--muted); border-color: var(--line); }
  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 12px; padding-top: 11px;
    border-top: 1px solid var(--line-soft); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    font-family: inherit; font-size: 13px; font-weight: 700; text-decoration: none;
    border-radius: 11px; padding: 9px 12px; border: 1px solid var(--line);
    background: var(--card-2); color: var(--text); cursor: pointer;
    transition: transform .12s ease, filter .2s; -webkit-user-select: none; user-select: none;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { flex: 1 1 130px; border-color: transparent; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 28%, transparent); }
  .btn.on { background: color-mix(in srgb, var(--green) 16%, var(--card)); border-color: color-mix(in srgb, var(--green) 30%, var(--line)); color: var(--green); }
  .status-wrap { position: relative; }
  select.status {
    appearance: none; -webkit-appearance: none; font-family: inherit; font-size: 12.5px;
    font-weight: 700; padding: 9px 26px 9px 10px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--text-2);
    cursor: pointer;
  }
  .status-wrap::after { content: "▾"; position: absolute; right: 9px; top: 50%;
    transform: translateY(-52%); font-size: 10px; color: var(--muted); pointer-events: none; }
  .memo-box { margin-top: 9px; }
  .memo-box textarea {
    width: 100%; min-height: 74px; resize: vertical; font-family: inherit; font-size: 13px;
    line-height: 1.55; padding: 10px 11px; border-radius: 12px; color: var(--text);
    background: var(--card-2); border: 1px solid var(--line); outline: none;
  }
  .memo-box textarea:focus { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .memo-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
  .memo-foot small { font-size: 11px; color: var(--muted); }
  .memo-foot .btn { padding: 5px 10px; font-size: 12px; }

  .empty {
    text-align: center; color: var(--muted); font-size: 13.5px; padding: 44px 10px;
    border: 1px dashed var(--line); border-radius: var(--radius); margin-top: 8px;
  }
  .footer { text-align: center; color: var(--muted); font-size: 11.5px; line-height: 1.7;
    padding: 26px 8px 8px; }
  .footer b { color: var(--text-2); }

  /* install hint */
  .hint-bar {
    display: flex; align-items: center; gap: 9px; margin-top: 12px; padding: 10px 12px;
    background: color-mix(in srgb, var(--accent) 8%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
    border-radius: 13px; font-size: 12px; color: var(--text-2); line-height: 1.45;
  }
  .hint-bar b { color: var(--text); }
  .hint-bar button { margin-left: auto; border: 0; background: transparent; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 2px 4px; }

  @media (min-width: 560px) {
    .summary { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stat-card.accent { grid-column: span 4; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="logo">🏆</div>
    <div class="brand">
      <h1>체험단 보드</h1>
      <p>신청 · 발표 · 후기 마감 한눈에</p>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="테마 전환">🌙</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" aria-label="요약">
    <div class="summary" id="summary"></div>
    <div id="installHint"></div>
  </section>

  <section class="controls" aria-label="필터">
    <div class="row-label">플랫폼</div>
    <div class="chips" id="platformChips" role="group" aria-label="플랫폼 필터"></div>
    <div class="row-label">상태</div>
    <div class="chips" id="statusChips" role="group" aria-label="상태 필터"></div>
    <div class="search-row" style="margin-top:10px">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="상품명·옵션 검색" autocomplete="off" enterkeyhint="search" />
      </label>
      <button class="sort-btn" id="sortBtn" type="button" aria-label="정렬 변경">발표 빠른순</button>
    </div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>
  <div class="empty" id="empty" hidden>조건에 맞는 체험단이 없어요.</div>

  <footer class="footer">
    <div id="footUpdated">불러오는 중…</div>
    <div>무신사 · 카카오 선물하기 신청 내역 기준 · 개인용 보드</div>
  </footer>
</main>

<script>
(function () {
  "use strict";

  var LS_KEY = "trialboard.v1";
  var STATUS = {
    applied:  "신청완료",
    won:      "당첨",
    reviewed: "후기완료",
    lost:     "미당첨"
  };
  var PLATFORMS = [
    { id: "all",     label: "전체" },
    { id: "musinsa", label: "무신사" },
    { id: "kakao",   label: "카카오 선물하기" },
    { id: "29cm",    label: "29CM" }
  ];
  var SORTS = [
    { id: "announce", label: "발표 빠른순" },
    { id: "chance",   label: "확률 높은순" },
    { id: "review",   label: "후기 마감순" },
    { id: "applied",  label: "최근 신청순" }
  ];

  // ── state ─────────────────────────────────
  var store = loadStore();
  var state = { platform: "all", status: "all", q: "", sort: store.sort || "announce", items: [], updatedAt: null };

  function loadStore() {
    try {
      var raw = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
      return {
        theme: raw.theme || "",
        sort: raw.sort || "announce",
        status: raw.status || {},
        check: raw.check || {},
        memo: raw.memo || {}
      };
    } catch (e) {
      return { theme: "", sort: "announce", status: {}, check: {}, memo: {} };
    }
  }
  function saveStore() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
  }

  // ── helpers ───────────────────────────────
  function today() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function parseDay(s) {
    if (!s) return null;
    var p = String(s).split("-");
    if (p.length < 3) return null;
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function daysFrom(d) {
    if (!d) return null;
    return Math.round((d - today()) / 86400000);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(n) { return (n || 0).toLocaleString("ko-KR"); }
  function mmdd(s) {
    var d = parseDay(s);
    if (!d) return "";
    return (d.getMonth() + 1) + "." + ("0" + d.getDate()).slice(-2);
  }
  function wd(s) {
    var d = parseDay(s);
    if (!d) return "";
    return "일월화수목금토"[d.getDay()];
  }
  function chance(it) {
    if (!it.applicants) return null;
    return (it.winners / it.applicants) * 100;
  }
  function chanceText(it) {
    var p = chance(it);
    if (p == null) return "-";
    if (p < 0.01) return "<0.01%";
    return p.toFixed(2) + "%";
  }
  function statusOf(it) { return store.status[it.id] || it.status || "applied"; }
  function ddayInfo(s) {
    var n = daysFrom(parseDay(s));
    if (n == null) return { cls: "past", text: "-" };
    if (n > 0) return { cls: n <= 2 ? "hot" : "", text: "D-" + n };
    if (n === 0) return { cls: "hot", text: "D-DAY" };
    return { cls: "past", text: "발표+" + Math.abs(n) };
  }
  function reviewInfo(it) {
    var start = daysFrom(parseDay(it.reviewStart));
    if (start != null && start > 0) return { cls: "", text: "후기 시작 D-" + start };
    var n = daysFrom(parseDay(it.reviewEnd));
    if (n == null) return null;
    if (n < 0) return { cls: "past", text: "후기 종료" };
    if (n === 0) return { cls: "hot", text: "후기 마감 D-DAY" };
    if (n <= 7) return { cls: "hot", text: "후기 마감 D-" + n };
    return { cls: "", text: "후기 마감 D-" + n };
  }
  function isReviewSoon(it) {
    var n = daysFrom(parseDay(it.reviewEnd));
    return n != null && n >= 0 && n <= 7 && statusOf(it) !== "lost";
  }

  // ── theme ─────────────────────────────────
  function applyTheme() {
    var t = store.theme || "";
    document.documentElement.setAttribute("data-theme", t);
    var btn = document.getElementById("themeBtn");
    var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
    btn.textContent = dark ? "☀️" : "🌙";
    btn.setAttribute("aria-label", dark ? "라이트 모드로" : "다크 모드로");
  }
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme") || "";
    var dark = cur === "dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
    store.theme = dark ? "light" : "dark";
    saveStore(); applyTheme();
  });

  // ── render ────────────────────────────────
  function renderSummary() {
    var items = state.items;
    var total = items.length;
    var won = items.filter(function (i) { return statusOf(i) === "won"; }).length;
    var soon = items.filter(isReviewSoon).length;

    var upcoming = items.filter(function (i) {
      var n = daysFrom(parseDay(i.announceAt));
      return n != null && n >= 0;
    }).sort(function (a, b) { return parseDay(a.announceAt) - parseDay(b.announceAt); });
    var first = upcoming[0];
    var fd = first ? ddayInfo(first.announceAt) : null;

    var html = "";
    html += card("전체 신청", total, "건", "",
      "무신사 " + items.filter(function (i) { return i.platform === "musinsa"; }).length +
      " · 카카오 " + items.filter(function (i) { return i.platform === "kakao"; }).length);
    html += card("가장 빠른 발표", fd ? fd.text : "-", "",
      "fast", first ? mmdd(first.announceAt) + " (" + wd(first.announceAt) + ") " + shortTitle(first.title) : "예정 없음");
    html += card("당첨", won, "건", "win", won ? "축하해요! 🎉" : "아직 발표 전");
    html += card("후기 마감 임박", soon, "건", "review", soon ? "7일 이내 마감" : "임박한 후기 없음");

    var upd = state.updatedAt;
    var updTxt = upd ? fmtDateTime(upd) : "-";
    html += '<div class="stat-card accent">' +
      '<div class="label">마지막 업데이트</div>' +
      '<div class="value">' + esc(updTxt) + '</div>' +
      '<div class="hint">당첨·후기 상태는 카드에서 직접 바꾸면 이 기기에만 저장돼요.</div>' +
      '</div>';

    document.getElementById("summary").innerHTML = html;
    document.getElementById("footUpdated").innerHTML = "마지막 업데이트 <b>" + esc(updTxt) + "</b>";
  }
  function card(label, value, unit, cls, hint) {
    return '<div class="stat-card ' + cls + '">' +
      '<div class="label">' + esc(label) + '</div>' +
      '<div class="value">' + esc(value) + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</div>' +
      '<div class="hint">' + esc(hint) + '</div></div>';
  }
  function shortTitle(t) {
    t = String(t || "");
    return t.length > 16 ? t.slice(0, 16) + "…" : t;
  }
  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var p = function (n) { return ("0" + n).slice(-2); };
    return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) +
      " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function renderChips() {
    var pEl = document.getElementById("platformChips");
    pEl.innerHTML = PLATFORMS.map(function (p) {
      var n = p.id === "all" ? state.items.length :
        state.items.filter(function (i) { return i.platform === p.id; }).length;
      return '<button class="chip" type="button" data-p="' + p.id + '" aria-pressed="' +
        (state.platform === p.id) + '">' + esc(p.label) + '<span class="n">' + n + '</span></button>';
    }).join("");

    var sEl = document.getElementById("statusChips");
    var base = state.items.filter(function (i) {
      return state.platform === "all" || i.platform === state.platform;
    });
    var opts = [{ id: "all", label: "전체" }].concat(Object.keys(STATUS).map(function (k) {
      return { id: k, label: STATUS[k] };
    }));
    sEl.innerHTML = opts.map(function (o) {
      var n = o.id === "all" ? base.length :
        base.filter(function (i) { return statusOf(i) === o.id; }).length;
      return '<button class="chip" type="button" data-s="' + o.id + '" aria-pressed="' +
        (state.status === o.id) + '">' + esc(o.label) + '<span class="n">' + n + '</span></button>';
    }).join("");
  }

  function visibleItems() {
    var q = state.q.trim().toLowerCase();
    var arr = state.items.filter(function (i) {
      if (state.platform !== "all" && i.platform !== state.platform) return false;
      if (state.status !== "all" && statusOf(i) !== state.status) return false;
      if (q) {
        var hay = (i.title || "") + " " + (i.option || "") + " " + (i.note || "");
        if (hay.toLowerCase().indexOf(q) === -1) return false;
      }
      return true;
    });
    arr.sort(function (a, b) {
      if (state.sort === "chance") return (chance(b) || 0) - (chance(a) || 0);
      if (state.sort === "review") {
        var ra = daysFrom(parseDay(a.reviewEnd)); ra = ra == null ? 9999 : ra;
        var rb = daysFrom(parseDay(b.reviewEnd)); rb = rb == null ? 9999 : rb;
        return ra - rb;
      }
      if (state.sort === "applied") return String(b.appliedAt).localeCompare(String(a.appliedAt));
      var na = daysFrom(parseDay(a.announceAt)); na = na == null ? 9999 : na;
      var nb = daysFrom(parseDay(b.announceAt)); nb = nb == null ? 9999 : nb;
      return na - nb || String(a.title).localeCompare(String(b.title));
    });
    return arr;
  }

  function cardHTML(it) {
    var st = statusOf(it);
    var dd = ddayInfo(it.announceAt);
    var rv = reviewInfo(it);
    var checked = !!store.check[it.id];
    var memo = store.memo[it.id] || "";
    var pl = it.platform === "musinsa" ? "무신사" : it.platform === "kakao" ? "카카오 선물하기" : it.platform === "29cm" ? "29CM" : it.platform;

    var h = '<article class="card' + (checked ? " done" : "") + '" data-id="' + esc(it.id) + '">';
    h += '<div class="card-top">';
    h += '<span class="badge ' + esc(it.platform) + '">' + esc(pl) + '</span>';
    h += '<span class="badge ' + st + '">' + esc(STATUS[st] || st) + '</span>';
    if (it.taxNotice) h += '<span class="tag">제세공과금 22%</span>';
    h += '<span class="dday ' + dd.cls + '">' + esc(dd.text) + '</span>';
    h += '</div>';

    h += '<h3 class="title">' + esc(it.title) + '</h3>';
    h += '<p class="option">옵션 · <b>' + (it.option ? esc(it.option) : "선택 없음") + '</b></p>';

    h += '<div class="metrics">';
    h += '<div class="metric"><div class="k">모집 / 신청</div><div class="v">' + num(it.winners) +
      ' <em>/ ' + num(it.applicants) + '명</em></div></div>';
    h += '<div class="metric hl"><div class="k">당첨 확률</div><div class="v">' + chanceText(it) + '</div></div>';
    h += '</div>';

    h += '<div class="timeline">';
    h += '<div class="tl"><span class="dot a"></span>발표 <b>' + esc(mmdd(it.announceAt)) + ' (' +
      esc(wd(it.announceAt)) + ')</b> <span class="sub">' + esc(dd.text) + '</span></div>';
    if (it.reviewStart || it.reviewEnd) {
      h += '<div class="tl"><span class="dot r"></span>후기 <b>' + esc(mmdd(it.reviewStart)) + ' ~ ' +
        esc(mmdd(it.reviewEnd)) + '</b>' + (rv ? ' <span class="sub">' + esc(rv.text) + '</span>' : '') + '</div>';
    }
    h += '<div class="tl"><span class="dot"></span>신청 <b>' + esc(mmdd(it.appliedAt)) + '</b>' +
      (it.note ? ' <span class="sub">· ' + esc(it.note) + '</span>' : '') + '</div>';
    h += '</div>';

    h += '<div class="actions">';
    h += '<a class="btn primary" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">캠페인 열기 ↗</a>';
    h += '<button class="btn check-btn' + (checked ? " on" : "") + '" type="button" data-act="check" ' +
      'aria-pressed="' + checked + '">' + (checked ? "확인함" : "확인") + '</button>';
    h += '<span class="status-wrap"><select class="status" data-act="status" aria-label="상태 변경">' +
      Object.keys(STATUS).map(function (k) {
        return '<option value="' + k + '"' + (k === st ? " selected" : "") + '>' + STATUS[k] + '</option>';
      }).join("") + '</select></span>';
    h += '<button class="btn" type="button" data-act="memo" aria-expanded="false">메모' +
      (memo ? " ·" : "") + '</button>';
    h += '</div>';

    h += '<div class="memo-box"' + (memo ? "" : " hidden") + '>';
    h += '<textarea placeholder="예: 배송지 확인, 후기 작성 링크, 사이즈 메모…" data-memo="1">' + esc(memo) + '</textarea>';
    h += '<div class="memo-foot"><small>이 기기에만 저장돼요</small>' +
      '<button class="btn" type="button" data-act="memo-save">저장</button></div>';
    h += '</div>';

    h += '</article>';
    return h;
  }

  function render() {
    renderSummary();
    renderChips();
    var arr = visibleItems();
    document.getElementById("list").innerHTML = arr.map(cardHTML).join("");
    document.getElementById("empty").hidden = arr.length > 0;
    document.getElementById("sortBtn").textContent =
      (SORTS.filter(function (s) { return s.id === state.sort; })[0] || SORTS[0]).label;
  }

  // ── events ────────────────────────────────
  document.getElementById("platformChips").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-p]");
    if (!b) return;
    state.platform = b.getAttribute("data-p");
    state.status = "all";
    render();
  });
  document.getElementById("statusChips").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-s]");
    if (!b) return;
    state.status = b.getAttribute("data-s");
    render();
  });
  var qEl = document.getElementById("q");
  var qTimer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = qEl.value; render(); }, 120);
  });
  document.getElementById("sortBtn").addEventListener("click", function () {
    var i = SORTS.map(function (s) { return s.id; }).indexOf(state.sort);
    state.sort = SORTS[(i + 1) % SORTS.length].id;
    store.sort = state.sort; saveStore();
    render();
  });

  document.getElementById("list").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var cardEl = btn.closest(".card");
    if (!cardEl) return;
    var id = cardEl.getAttribute("data-id");
    var act = btn.getAttribute("data-act");
    var item = state.items.filter(function (i) { return i.id === id; })[0];

    if (act === "check") {
      if (store.check[id]) delete store.check[id]; else store.check[id] = true;
      saveStore();
      cardEl.classList.toggle("done", !!store.check[id]);
      btn.classList.toggle("on", !!store.check[id]);
      btn.textContent = store.check[id] ? "확인함" : "확인";
      btn.setAttribute("aria-pressed", String(!!store.check[id]));
    } else if (act === "memo") {
      var box = cardEl.querySelector(".memo-box");
      box.hidden = !box.hidden;
      btn.setAttribute("aria-expanded", String(!box.hidden));
      if (!box.hidden) box.querySelector("textarea").focus();
    } else if (act === "memo-save") {
      var ta = cardEl.querySelector("textarea");
      var v = ta.value.trim();
      if (v) store.memo[id] = v; else delete store.memo[id];
      saveStore();
      btn.textContent = "저장됨";
      setTimeout(function () { btn.textContent = "저장"; }, 1200);
    }
  });

  document.getElementById("list").addEventListener("change", function (e) {
    var sel = e.target.closest("select[data-act='status']");
    if (!sel) return;
    var cardEl = sel.closest(".card");
    var id = cardEl.getAttribute("data-id");
    var item = state.items.filter(function (i) { return i.id === id; })[0];
    if (item && sel.value === item.status) delete store.status[id];
    else store.status[id] = sel.value;
    saveStore();
    render();
  });

  // autosave memo on blur
  document.getElementById("list").addEventListener("focusout", function (e) {
    var ta = e.target.closest("textarea[data-memo]");
    if (!ta) return;
    var cardEl = ta.closest(".card");
    var id = cardEl.getAttribute("data-id");
    var v = ta.value.trim();
    if (v) store.memo[id] = v; else delete store.memo[id];
    saveStore();
  });

  // install hint (iOS Safari, not standalone)
  function installHint() {
    var el = document.getElementById("installHint");
    if (window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone ||
        localStorage.getItem(LS_KEY + ".hideHint")) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="hint-bar"><span>📲</span><span>사파리 하단 <b>공유</b> → <b>홈 화면에 추가</b>하면 앱처럼 열려요.</span>' +
      '<button type="button" aria-label="닫기">×</button></div>';
    el.querySelector("button").addEventListener("click", function () {
      localStorage.setItem(LS_KEY + ".hideHint", "1");
      el.innerHTML = "";
    });
  }

  // ── boot ──────────────────────────────────
  function boot() {
    applyTheme();
    fetch("data/trials.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        state.items = (data.items || []).slice();
        state.updatedAt = data.updatedAt || null;
        render(); installHint();
      })
      .catch(function (err) {
        document.getElementById("list").innerHTML =
          '<div class="empty">데이터를 불러오지 못했어요.<br><small>' + esc(err.message) +
          '</small><br><br><button class="btn" onclick="location.reload()">다시 시도</button></div>';
        document.getElementById("footUpdated").textContent = "데이터 로드 실패";
      });
  }
  boot();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
